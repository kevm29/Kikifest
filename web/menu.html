<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kikifest</title>
<style>
  :root {
    --sky: #5f9fdf; --page: #dde9f7; --violet: #9b7cc6; --violet-dark: #6d4f9a;
    --panel: #b49ad6; --panel2: #8f86b3; --ink: #3c2f5c; --link: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: linear-gradient(#4f8fd4, #7fb3e8 60%, #a9cdf0); color: var(--ink);
    font: 15px "Trebuchet MS", Verdana, sans-serif; min-height: 100vh; }
  .sheet { max-width: 980px; margin: 0 auto; background: var(--page); min-height: 100vh;
    border-left: 4px solid var(--violet); border-right: 4px solid var(--violet); position: relative; }
  header { text-align: center; padding: 22px 16px 10px;
    background: radial-gradient(ellipse at 50% 0, #fff 0, #eaf2fb 45%, transparent 70%),
                repeating-conic-gradient(from 0deg at 50% 0, #d4e3f4 0 6deg, #e8f0fa 6deg 12deg);
    border-top: 14px solid #fff; border-radius: 0 0 0 0; }
  header h1 { margin: 0; font: bold 64px/1 Georgia, "Times New Roman", serif; letter-spacing: 4px;
    color: #c9b6e8; -webkit-text-stroke: 2px var(--violet-dark);
    text-shadow: 0 3px 0 #fff, 0 6px 10px rgba(80,50,140,.35); }
  header .sub { display: inline-block; margin-top: 8px; padding: 4px 18px; border-radius: 6px;
    background: linear-gradient(#a8743c, #7a4f22); color: #fde9b8; font: italic bold 15px Georgia, serif;
    transform: rotate(-3deg); box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .bar { margin: 12px 16px 0; padding: 4px 12px; border-radius: 10px; color: #fff; font-weight: bold;
    background: repeating-linear-gradient(-45deg, #a68bd0 0 8px, #b79ddd 8px 16px); text-align: center; }
  .bar input { font: inherit; color: #fff; background: transparent; border: 0; border-bottom: 1px dashed #fff;
    width: 7em; text-align: center; }
  .layout { display: flex; gap: 18px; padding: 24px 16px 40px; }
  nav { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; margin-left: -10px; }
  .cube { width: 92px; height: 86px; border-radius: 10px; cursor: pointer; position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(214,190,245,.85) 45%, rgba(160,120,220,.9));
    border: 3px solid #b48ee6; box-shadow: inset 0 0 12px #fff, 3px 4px 0 #9a74d4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .1s; }
  .cube:nth-child(even) { margin-left: 12px; }
  .cube:hover, .cube.on { transform: rotate(-4deg) scale(1.05); border-color: #fff; }
  .cube .lbl { font-size: 11px; font-weight: bold; color: var(--violet-dark); }
  main { flex: 1; display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; min-width: 0; }
  .panel { border-radius: 12px; padding: 10px 16px 16px; color: #fff; }
  .panel h2 { margin: 0 0 10px; text-align: right; font-size: 21px; border-bottom: 1px solid rgba(255,255,255,.5); padding-bottom: 4px; }
  .modes { background: var(--panel); flex: 0 0 210px; }
  .mode { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin: 14px 0; min-height: 28px; }
  .mode a { color: var(--link); text-decoration: underline; cursor: pointer; font-weight: bold; }
  .mode a.sel { color: #fff8c8; }
  .mode .locked { opacity: .75; }
  .qmark { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center;
    background: radial-gradient(#7a7fd6, #3e3f9e); color: #fff; font-weight: bold; border: 2px solid #fff; }
  .detail { background: var(--panel2); flex: 1; min-width: 260px; }
  .detail p { margin: 6px 0; }
  .detail .bonus { margin-top: 14px; font-style: italic; color: #fff8c8; }
  .options { margin: 12px 0; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.15); }
  .options h3 { margin: 0 0 6px; font-size: 14px; }
  .options label { display: block; margin: 3px 0; cursor: pointer; }
  .button { display: block; width: max-content; margin: 18px auto 4px; padding: 6px 26px; border-radius: 6px; cursor: pointer;
    background: linear-gradient(#cbb4ec, #a385d6); color: #fff; font-weight: bold; font-size: 18px; text-decoration: none;
    box-shadow: 0 3px 0 #7e5fb3; }
  .button:hover { filter: brightness(1.08); }
  .wide { background: var(--panel2); flex: 1; min-width: 0; }
  .wide .intro { margin: 0 0 10px; }
  .wide h2.sub { text-align: left; font-size: 17px; margin-top: 18px; }
  .family, .quest { background: rgba(255,255,255,.12); border-radius: 10px; padding: 8px 12px; margin: 10px 0; }
  .family h3, .quest h3 { margin: 0 0 6px; font-size: 15px; }
  .family .count { font-weight: normal; opacity: .8; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .cell { width: 54px; height: 62px; border-radius: 8px; background: rgba(255,255,255,.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cell.unknown { background: rgba(0,0,0,.12); }
  .qty { font-size: 12px; font-weight: bold; }
  .reqs { display: flex; flex-wrap: wrap; gap: 10px; }
  .req { display: inline-flex; flex-direction: column; align-items: center; opacity: .9; }
  .req.ok .qty { color: #c8ffb0; }
  img.item.dark { filter: brightness(0) opacity(.45); }
  .quest.done { background: rgba(200,255,190,.18); }
  .reward { margin: 8px 0 0; font-style: italic; }
  .spoil { display: block; font-size: 13px; cursor: pointer; opacity: .9; }
  footer { text-align: center; font-size: 12px; opacity: .7; padding: 0 16px 20px; }
  #status { text-align: center; padding: 30px; }
  @media (max-width: 640px) {
    header h1 { font-size: 40px; }
    .layout { flex-direction: column; }
    nav { flex-direction: row; margin: 0; }
    .cube { width: 74px; height: 70px; } .cube:nth-child(even) { margin-left: 0; }
    .modes { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <h1>Kikifest</h1>
    <div class="sub">Les Cavernes, à deux</div>
    <div class="bar"><input id="player" aria-label="Nom du joueur"> ~ <span id="count">0</span> objets</div>
  </header>
  <div class="layout">
    <nav>
      <div class="cube" data-view="jouer" data-item="36"><div class="ico"></div><span class="lbl">Jouer</span></div>
      <div class="cube" data-view="frigo" data-item="1003"><div class="ico"></div><span class="lbl">Frigo</span></div>
      <div class="cube" data-view="quetes" data-item="1027"><div class="ico"></div><span class="lbl">Quêtes</span></div>
    </nav>
    <main id="main"><div id="status">Chargement…</div></main>
  </div>
  <footer>D'après <i>Hammerfest</i> de Motion Twin (2006), sous licence CC BY-NC-SA 4.0. Adaptation non officielle et non commerciale.</footer>
</div>
<script src="js/menu.js"></script>
</body>
</html>
